<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<style>
  :root {
    --bg: #F6F4F0;
    --surface: #FFFFFF;
    --surface-2: #F1EEE8;
    --text: #23211E;
    --text-2: #6B665E;
    --border: #E3DED5;
    --primary: #2F5D50;
    --primary-hover: #244A40;
    --primary-soft: #E3EDE9;
    --on-primary: #FFFFFF;
    --accent: #B9784A;
    --accent-soft: #F6EADF;
    --error: #B3261E;
    --radius: 14px;
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.04);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161816;
      --surface: #1F2220;
      --surface-2: #272B28;
      --text: #ECE9E3;
      --text-2: #A39E95;
      --border: #343935;
      --primary: #7FB8A6;
      --primary-hover: #95C7B7;
      --primary-soft: #23332E;
      --on-primary: #10201B;
      --accent: #D9A27A;
      --accent-soft: #3A2C22;
      --error: #F2B8B5;
      --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    font-size: 15px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--primary); }
  .hidden { display: none !important; }
  [hidden] { display: none !important; }   /* 버튼 등 display 지정 요소도 hidden이면 반드시 숨김 */

  /* 상단 바 */
  .topbar { position: sticky; top: 0; z-index: 5; background: var(--surface); border-bottom: 1px solid var(--border); }
  .topbar-in { max-width: 1240px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 12px; }
  .logo { display: inline-flex; align-items: center; gap: 8px; font-weight: 800; font-size: 17px; letter-spacing: -0.02em; color: var(--text); text-decoration: none; margin-right: auto; }
  .logo img { border-radius: 7px; flex-shrink: 0; }
  .login-logo { display: block; margin: 0 auto 12px; border-radius: 13px; }
  .user-mail { font-size: 13px; color: var(--text-2); max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  @media (max-width: 600px) { .user-mail { display: none; } }

  /* 레이아웃 */
  .layout { max-width: 1240px; margin: 0 auto; padding: 20px 16px 80px; display: grid; grid-template-columns: 230px 1fr; gap: 42px; align-items: start; }
  @media (max-width: 860px) { .layout { grid-template-columns: 1fr; } }
  .sidebar { position: sticky; top: 72px; min-width: 0; }
  #main { min-width: 0; }
  .nav > *, .tree, .tree-kids, .tree-kids > * { min-width: 0; }
  @media (max-width: 860px) { .sidebar { position: static; } }
  .side-title { font-size: 12px; font-weight: 700; color: var(--text-2); margin: 0 0 8px 10px; }
  .nav { display: grid; gap: 2px; }
  .nav a {
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
    padding: 8px 10px; border-radius: 9px; color: var(--text); text-decoration: none; font-size: 14px;
  }
  .nav a:hover { background: var(--surface-2); }
  .nav a.on { background: var(--primary-soft); color: var(--primary); font-weight: 700; }
  .nav .cnt { font-size: 12px; color: var(--text-2); }
  .nav-gap { height: 14px; }
  .nav-add { display: block; width: 100%; text-align: left; margin-bottom: 8px; padding: 8px 10px; border: 0; border-radius: 9px; background: none; font: inherit; font-size: 14px; font-weight: 600; color: var(--primary); cursor: pointer; }
  .nav-add:hover { background: var(--surface-2); }
  .nav-search { position: relative; margin-bottom: 10px; }
  .nav-search svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 14px; height: 14px; color: var(--text-2); pointer-events: none; }
  .nav-search input[type="search"] { height: 32px; padding: 0 10px 0 30px; font-size: 13px; border-radius: 8px; }
  .nav mark { background: var(--accent-soft); color: inherit; border-radius: 3px; padding: 0 1px; }
  .nav-empty { font-size: 13px; color: var(--text-2); padding: 8px 10px; }
  .nav-tip { position: fixed; z-index: 200; max-width: 320px; padding: 6px 10px; border-radius: 8px; background: var(--text); color: var(--surface); font-size: 12.5px; line-height: 1.45; pointer-events: none; box-shadow: 0 4px 14px rgba(0,0,0,.18); }
  .tree-row { display: flex; align-items: center; gap: 2px; }
  .tree-row a { flex: 1; min-width: 0; }
  .nav a.parent { font-weight: 700; }
  .tw { width: 22px; height: 22px; flex-shrink: 0; border: 0; background: none; color: var(--text-2); cursor: pointer; border-radius: 6px; font-size: 11px; transition: transform .15s; }
  .tw:hover { background: var(--surface-2); color: var(--text); }
  .tw[aria-expanded="true"] { transform: rotate(90deg); }
  .tree-kids { display: grid; gap: 1px; margin: 2px 0 8px 22px; padding-left: 6px; border-left: 1px solid var(--border); }
  .nav a.kid { justify-content: flex-start; gap: 6px; padding: 6px 8px; font-size: 13px; color: var(--text-2); }
  .nav a.kid.on { color: var(--primary); }
  .nav .kt { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ktag { flex-shrink: 0; font-size: 10.5px; font-weight: 700; padding: 1px 6px; border-radius: 999px; }
  .ktag.analysis { background: var(--accent-soft); color: var(--accent); }
  .ktag.journal { background: var(--primary-soft); color: var(--primary); }
  .kid-empty { font-size: 12.5px; color: var(--text-2); padding: 6px 8px; }
  @media (max-width: 860px) {
    .nav { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
    .nav a { white-space: nowrap; background: var(--surface); border: 1px solid var(--border); }
    .nav-gap, .side-title { display: none; }
    .tree, .tree-row { display: contents; }
    .tw, .tree-kids { display: none; }
  }

  /* 공통 요소 */
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 22px; box-shadow: var(--shadow); }
  .card h3 { font-size: 15px; margin: 0 0 4px; }
  .sub { color: var(--text-2); font-size: 13px; margin: 0 0 14px; }
  .page-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  .page-head h2 { font-size: 22px; margin: 0; letter-spacing: -0.02em; }
  .eyebrow { font-size: 12px; color: var(--accent); font-weight: 700; }
  .back { font-size: 13px; color: var(--text-2); text-decoration: none; display: inline-block; margin-bottom: 6px; }
  .back:hover { color: var(--primary); }
  .editor-head { align-items: center; position: sticky; top: 56px; z-index: 4; background: var(--bg); padding: 12px 0; margin: -12px 0 4px; }
  .head-actions { align-items: center; }
  .save-state { font-size: 12.5px; color: var(--text-2); }
  .save-state.saved { color: var(--primary); }
  .save-state.error { color: var(--error); }
  .head-actions .btn.danger { margin-right: 8px; }
  .modal-back { position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,.4); display: grid; place-items: center; padding: 16px; }
  .modal { width: 100%; max-width: 560px; max-height: calc(100vh - 32px); display: flex; flex-direction: column; background: var(--surface); border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,.25); }
  .modal-body { overflow: auto; padding: 22px 22px 10px; }
  .modal-body h3 { font-size: 17px; margin: 0 0 4px; }
  .modal-hist { margin-top: 10px; padding-top: 14px; border-top: 1px solid var(--border); }
  .modal-note { font-size: 13px; color: var(--accent); margin: 12px 0 0; }
  .modal-sm { max-width: 420px; }
  .modal-lg { max-width: 720px; }
  .seg { display: flex; flex-wrap: wrap; gap: 4px; padding: 4px; margin-bottom: 18px; background: var(--surface-2); border-radius: 10px; width: fit-content; max-width: 100%; }
  .seg-btn { height: 32px; padding: 0 14px; border: 0; border-radius: 8px; background: none; font: inherit; font-size: 13px; font-weight: 600; color: var(--text-2); cursor: pointer; }
  .seg-btn:hover { color: var(--text); }
  .seg-btn.on { background: var(--surface); color: var(--text); box-shadow: 0 1px 4px rgba(0,0,0,.1); }
  .bulk-title { font-size: 16px; margin: 0 0 4px; }
  .split-hint { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 8px; font-size: 12.5px; color: var(--text-2); }
  .split-hint.on { justify-content: space-between; padding: 10px 12px; border-radius: 10px; background: var(--primary-soft); color: var(--text); font-size: 13.5px; }
  .split-hint .btn { background: var(--surface); color: var(--primary); }
  .read-title { font-size: 22px; margin: 0 0 14px; letter-spacing: -0.02em; overflow-wrap: anywhere; }
  .read-field + .read-field { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border); }
  .read-label { font-size: 12.5px; font-weight: 700; color: var(--text-2); margin-bottom: 4px; }
  .read-value { font-size: 14.5px; line-height: 1.7; white-space: pre-wrap; overflow-wrap: anywhere; }
  .split-hint .btn:hover { background: var(--primary); color: var(--on-primary); }
  .bulk-actions { display: flex; justify-content: flex-end; align-items: center; gap: 8px; margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--border); }
  .hint-line { font-size: 12.5px; color: var(--text-2); margin: 8px 0 0; line-height: 1.6; }
  .hint-line.warn { color: var(--accent); }
  .file-link { cursor: pointer; margin-left: 4px; }
  .imp-list { display: grid; gap: 10px; margin-top: 12px; }
  .imp-row { display: flex; gap: 10px; align-items: flex-start; padding: 12px; border: 1px solid var(--border); border-radius: 12px; }
  .imp-check { margin-top: 10px; width: 17px; height: 17px; accent-color: var(--primary); flex-shrink: 0; }
  .imp-main { flex: 1; min-width: 0; display: grid; gap: 6px; }
  .imp-title { font-weight: 700; font-size: 14px; padding: 6px 10px !important; }
  .imp-body { font-size: 13px; min-height: 0; }
  .imp-status { flex-shrink: 0; min-width: 44px; font-size: 12.5px; color: var(--text-2); text-align: right; margin-top: 10px; }
  .field-error { margin: 6px 0 0; font-size: 12.5px; color: var(--error); }
  input.invalid, input.invalid:focus { outline: 2px solid var(--error); outline-offset: -1px; }
  .name-row { display: flex; align-items: center; gap: 4px; min-width: 0; }
  .name-row h2 { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .more { position: relative; }
  .more-btn { width: 32px; height: 32px; border: 0; border-radius: 8px; background: none; color: var(--text-2); font-size: 20px; line-height: 1; cursor: pointer; }
  .more-btn:hover, .more-btn[aria-expanded="true"] { background: var(--surface-2); color: var(--text); }
  .more-menu { position: absolute; top: calc(100% + 4px); left: 0; z-index: 50; min-width: 140px; padding: 6px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,.12); display: grid; }
  .more-menu[hidden] { display: none; }
  .more-menu.right { left: auto; right: 0; }
  .more-menu button { text-align: left; padding: 8px 10px; border: 0; border-radius: 8px; background: none; font: inherit; font-size: 14px; color: var(--text); cursor: pointer; }
  .more-menu button:hover, .more-menu button:focus-visible { background: var(--surface-2); outline: none; }
  .more-menu button.danger { color: var(--error); }
  .del-label { display: block; font-size: 13px; color: var(--text-2); margin-bottom: 6px; }
  .btn.btn-delete { background: var(--error); color: #fff; }
  .btn.btn-delete:hover:not(:disabled) { filter: brightness(1.08); }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; padding: 14px 22px; border-top: 1px solid var(--border); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .stack { display: grid; gap: 16px; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    border: 0; border-radius: 10px; padding: 11px 18px; font: inherit; font-weight: 700; cursor: pointer;
    background: var(--primary); color: var(--on-primary); text-decoration: none; white-space: nowrap;
  }
  .btn:hover { background: var(--primary-hover); }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn.block { width: 100%; }
  .btn.ghost { background: var(--surface-2); color: var(--text); }
  .btn.soft { background: var(--primary-soft); color: var(--primary); }
  .btn.soft:hover { background: var(--primary); color: var(--on-primary); }
  .btn.ghost:hover { background: var(--border); }
  .btn.danger { background: transparent; color: var(--error); }
  .btn.danger:hover { background: var(--surface-2); }
  .btn.small { padding: 7px 12px; font-size: 13px; font-weight: 600; }
  .btn.h32 { height: 32px; padding: 0 12px; font-size: 13px; border-radius: 8px; }
  .link-btn { border: 0; background: none; color: var(--primary); font: inherit; font-size: 13px; cursor: pointer; padding: 0; text-decoration: underline; text-underline-offset: 3px; }

  .field { margin-bottom: 16px; }
  .field label { display: block; font-weight: 600; font-size: 14px; margin-bottom: 6px; }
  textarea, input[type="text"], input[type="password"], input[type="search"] {
    width: 100%; font: inherit; color: var(--text);
    background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px;
  }
  textarea { resize: vertical; min-height: 64px; }
  textarea.free { min-height: 220px; }   /* 문장으로 쓰기 칸은 넉넉하게 */
  textarea:focus, input:focus { outline: 2px solid var(--primary); outline-offset: -1px; border-color: transparent; }
  textarea::placeholder, input::placeholder { color: var(--text-2); opacity: .75; }
  .title-input { font-size: 20px; font-weight: 700; background: transparent; border-color: transparent; padding: 4px 8px; margin-left: -8px; }
  .title-input:hover { border-color: var(--border); }

  /* 기록 목록 */
  .list { display: grid; gap: 10px; }
  .item { display: flex; gap: 14px; align-items: flex-start; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; cursor: pointer; }
  .item:hover { border-color: var(--primary); }
  .item-body { flex: 1; min-width: 0; }
  .item-title { font-weight: 700; font-size: 15px; overflow-wrap: anywhere; }
  .item-meta { font-size: 12.5px; color: var(--text-2); margin-top: 2px; }
  .item-preview { font-size: 13px; color: var(--text-2); margin-top: 6px; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .tag { display: inline-block; font-size: 11.5px; font-weight: 700; padding: 2px 8px; border-radius: 999px; margin-right: 6px; vertical-align: 1px; }
  .tag.analysis { background: var(--accent-soft); color: var(--accent); }
  .tag.journal { background: var(--primary-soft); color: var(--primary); }
  .empty { text-align: center; padding: 40px 20px; color: var(--text-2); }
  .empty b { display: block; color: var(--text); font-size: 16px; margin-bottom: 6px; }

  /* 작성 화면 */
  .grid { display: grid; grid-template-columns: 1fr 300px; gap: 18px; align-items: start; }
  @media (max-width: 1060px) { .grid { grid-template-columns: 1fr; } }
  .side { position: sticky; top: 72px; display: grid; gap: 12px; }
  @media (max-width: 1060px) { .side { position: static; } }
  .lens { display: flex; gap: 10px; align-items: flex-start; padding: 9px 0; border-top: 1px solid var(--border); cursor: pointer; }
  .lens:first-of-type { border-top: 0; }
  .lens input, .check input { margin-top: 4px; width: 17px; height: 17px; accent-color: var(--primary); flex-shrink: 0; }
  .lens .num { font-size: 12px; color: var(--accent); font-weight: 700; }
  .lens .t { font-weight: 600; font-size: 14px; }
  .lens .d { font-size: 12.5px; color: var(--text-2); }
  .check { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; font-size: 14px; }
  .check small { display: block; color: var(--text-2); font-size: 12.5px; }

  .out-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
  .status { font-size: 13px; color: var(--text-2); display: flex; align-items: center; gap: 8px; }
  .status:not(:empty) { margin-bottom: 14px; }
  .spinner { width: 14px; height: 14px; border: 2px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin .8s linear infinite; flex-shrink: 0; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .progress { flex: 1; min-width: 0; }
  .pbar { height: 8px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
  .pfill { height: 100%; background: var(--primary); border-radius: 99px; transition: width .5s ease; }
  .pfill.indet { width: 28%; animation: indet 1.3s ease-in-out infinite; }
  @keyframes indet { from { transform: translateX(-100%); } to { transform: translateX(360%); } }
  .pmeta { display: flex; justify-content: space-between; gap: 12px; margin-top: 8px; font-size: 13px; color: var(--text-2); }
  .pmeta b { color: var(--text); font-weight: 700; font-variant-numeric: tabular-nums; }
  .pmeta .step { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  @media (prefers-reduced-motion: reduce) { .pfill { transition: none; } .pfill.indet { animation: none; width: 100%; opacity: .35; } }
  .result { font-size: 14.5px; line-height: 1.75; overflow-wrap: anywhere; }
  .result h1, .result h2, .result h3 { line-height: 1.4; margin: 1.4em 0 .5em; }
  .result h1 { font-size: 19px; } .result h2 { font-size: 17px; } .result h3 { font-size: 15.5px; }
  .result > :first-child { margin-top: 0; }
  .result table { border-collapse: collapse; width: 100%; margin: .8em 0; font-size: 13.5px; display: block; overflow-x: auto; }
  .result th, .result td { border: 1px solid var(--border); padding: 7px 10px; text-align: left; vertical-align: top; }
  .result th { background: var(--surface-2); }
  .result blockquote { margin: .8em 0; padding: 4px 14px; border-left: 3px solid var(--accent); color: var(--text-2); }
  .result-edit { min-height: 480px; font-size: 13.5px; line-height: 1.6; }
  .error-box { color: var(--error); background: var(--surface-2); padding: 12px 14px; border-radius: 10px; font-size: 14px; }
  .savebar { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 18px; }
  .dirty { font-size: 13px; color: var(--accent); }

  /* 로그인 · 안내 */
  .center { min-height: 100vh; display: grid; place-items: center; padding: 16px; }
  .login { max-width: 420px; width: 100%; text-align: center; }
  .login h1 { font-size: 26px; margin: 0 0 6px; letter-spacing: -0.02em; }
  .login p { color: var(--text-2); margin: 0 0 24px; }
  .gbtn { display: inline-flex; align-items: center; gap: 10px; padding: 12px 22px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font: inherit; font-weight: 700; cursor: pointer; }
  .gbtn:hover { background: var(--surface-2); }
  .features { display: grid; gap: 8px; text-align: left; margin: 26px 0 0; padding: 0; list-style: none; font-size: 14px; color: var(--text-2); }
  .features li::before { content: "✓"; color: var(--primary); font-weight: 800; margin-right: 8px; }
  .steps { counter-reset: s; list-style: none; padding: 0; margin: 0 0 18px; display: grid; gap: 8px; }
  .steps li { counter-increment: s; display: flex; gap: 10px; align-items: flex-start; font-size: 14px; }
  .steps li::before { content: counter(s); flex-shrink: 0; width: 22px; height: 22px; border-radius: 50%; background: var(--primary-soft); color: var(--primary); font-weight: 700; font-size: 12px; display: grid; place-items: center; margin-top: 1px; }
  .key-state { font-size: 13px; margin-top: 8px; }
  .key-state.ok { color: var(--primary); }
  .key-state.bad { color: var(--error); }

  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px);
    background: var(--text); color: var(--bg); padding: 10px 18px; border-radius: 999px; font-size: 14px;
    opacity: 0; transition: .2s; pointer-events: none; z-index: 20;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
